name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, checkstyle and tests
        run: ./gradlew build
      - name: Generated resources are up to date
        run: |
          ./gradlew runData
          git status --porcelain -- src/generated
          test -z "$(git status --porcelain -- src/generated)"
